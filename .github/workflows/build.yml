# SPDX-License-Identifier: GPL-3.0-only
# Builds the SDK image, runs the portable tests under sanitizers, builds the host and probes, and
# uploads the release archive. Third-party builds (out/deps) are cached by the pinned sources and build scripts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build SDK image
        run: docker build -t prosperosunshine-sdk:v0.45 -f scripts/Dockerfile .

      - name: Cache third-party builds
        id: deps-cache
        uses: actions/cache@v4
        with:
          # deps.sh rebuilds a library whenever its extracted source tree is missing, so the
          # extracted trees are cached together with the build output.
          path: |
            out/deps
            .cache/deps/dl
            .cache/deps/src
          key: deps-${{ hashFiles('deps.lock', 'scripts/deps.sh', 'scripts/deps/**', 'patches/**', 'scripts/Dockerfile') }}
          # An older cache still has the downloaded archives, so a run doesn't depend on every
          # upstream server being reachable. deps.sh checks each archive against deps.lock.
          restore-keys: deps-

      - name: Keep only the downloads from an older cache
        # Builds from an older cache may not match changed patches, dependencies or the SDK image.
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: rm -rf out/deps .cache/deps/src

      - name: Unit tests (ASan/UBSan)
        run: docker run --rm --mount type=bind,source="$PWD",target=/repo prosperosunshine-sdk:v0.45 bash scripts/test.sh

      - name: Build host and probes
        run: docker run --rm -e PROSPERO_COMMIT="${GITHUB_SHA::8}" --mount type=bind,source="$PWD",target=/repo prosperosunshine-sdk:v0.45 bash scripts/build.sh

      - name: Package
        run: bash scripts/package.sh "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}"

      - uses: actions/upload-artifact@v4
        with:
          name: prosperosunshine-${{ github.sha }}
          path: dist/*.tar.gz

      - name: Let the cache step read the dependency builds
        # The container writes them as root, and actions/cache saves them after the job as the runner
        # user; files it can't read made every save fail, so each run fetched and built everything anew.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out .cache || true
